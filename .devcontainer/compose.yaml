services:
  vscode:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        UV_VERSION: latest
    command: "sleep infinity"
    ports:
      - "8000:8000"
    user: vscode
    volumes:
      - ..:/workspace:cached
    dns:
      - 8.8.8.8 # Google Public DNS Primary
      - 1.1.1.1 # Cloudflare DNS Primary

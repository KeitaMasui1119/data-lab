name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job below delegates to a nox session so the command CI runs is the
# command a developer runs locally. noxfile.py holds the flags -- including
# the coverage floor -- so the two cannot drift.
jobs:
  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-with-uv
      - name: Ruff check
        run: uv run nox -s lint

  format:
    name: Format (ruff format --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-with-uv
      - name: Ruff format check
        run: uv run nox -s format_check

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-with-uv
      - name: Pyright
        run: uv run nox -s typecheck

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-with-uv
      - name: Pytest
        run: uv run nox -s test

  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Actionlint
        uses: reviewdog/action-actionlint@v1

  hadolint:
    name: Lint Dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile

  # Build the three shippable stages on every PR. `dev` is the devcontainer
  # image; `prd` and `dashboard` are what deploy.yml publishes on merge.
  # Catching a Dockerfile break here beats catching it after main is broken.
  # No push -- images are thrown away when the job ends.
  docker-build:
    name: Build Docker image (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prd, dashboard]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

[project]
name = "default"
version = "0.1.0"
description = "This repository contains configurations to set up a Python development environment using VSCode's Dev Container feature. The environment includes uv and Ruff."

requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "beautifulsoup4>=4.14.2",
    "google-cloud-logging>=3.12.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "cookiecutter>=2.6.0",
    "cookiecutter-data-science>=2.3.0",
    "mkdocs-material>=9.6.21",
    "nox>=2025.5.1",
    "pre-commit>=4.3.0",
    "pyright>=1.1.406",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

ds = [
    "ipykernel>=7.1.0",
    "pandas>=2.3.0",
    "numpy>=2.3.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "polars>=1.35.0",
    "plotly>=6.3.0",
    "pyarrow>=22.0.0",
    "scikit-learn>=1.7.0",
    "nbformat>=4.2.0",
    "scipy>=1.16.0",
    "lightgbm>=4.6.0",
    "statsmodels>=0.14.0",
    "prophet>=1.2.0",
]

de = [
    "dbt-core>=1.10.0",
    "polars>=1.35.0",
    "pandas>=2.3.0",
    "luigi>=3.6.0",
    "apache-airflow>=3.1.0",
    "pyiceberg>=0.10.0",
    "dbt-duckdb>=1.9.0",
    "shandy-sqlfmt[jinjafmt]>=0.26.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.14.0",
    "lxml>=6.0.0",
    "scrapy>=2.13.0",
    "yfinance>=0.2.60",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

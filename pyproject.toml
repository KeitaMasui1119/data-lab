[project]
name = "default"
version = "0.1.0"
description = "This repository contains configurations to set up a Python development environment using VSCode's Dev Container feature. The environment includes uv and Ruff."

requires-python = ">=3.13"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    'boto3==1.42.84',
    'dbt-core>=1.11.7',
    'dbt-duckdb>=1.10.1',
    # Direct dependency: the silver and gold transforms are built on DuckDB.
    # It used to arrive only transitively via dbt-duckdb, which made the whole
    # pipeline hostage to a package the project does not otherwise use yet.
    'duckdb>=1.4.1',
    'ipykernel>=7.2.0',
    "jpholiday>=1.0.3",
    'plotly>=6.6.0',
    'polars>=1.39.3',
    'pyarrow>=23.0.1',
    'pyiceberg[s3fs, sql-sqlite, pyiceberg-core]>=0.11.1',
    'requests>=2.33.0',
    'shandy-sqlfmt[jinjafmt]>=0.29.0',
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    'nox>=2026.2.9',
    'pre-commit>=4.5.1',
    'pyright>=1.1.408',
    'pytest>=9.0.2',
    'pytest-cov>=7.1.0',
    # Keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml.
    'ruff>=0.16.3',
]

# Airflow will drive the pipeline once orchestration moves off the CLI, but
# nothing imports it today. Leaving it in the default resolve makes every
# `uv sync` and every Renovate scan carry its dependency tree -- the largest
# in this project. Kept here so `uv sync --group airflow` installs it when the
# migration actually starts, without holding routine work hostage in the
# meantime.
airflow = [
    'apache-airflow>=3.1.8',
]

[tool.uv]
# This repository is an application, not a distributable library. Entry points are
# invoked as `python src/main.py`, and `tests/conftest.py` puts `src` on sys.path,
# so nothing imports the project as an installed distribution.
package = false
# Without this, uv treats every dependency group as default -- moving airflow
# to its own group would not skip installation. Explicit list pins `dev` as the
# only always-on group; `airflow` opts in with `uv sync --group airflow`.
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (RustFS, DuckDB, dbt)",
    "unit: tests that run purely in-process (no network, no storage, no catalog)",
]

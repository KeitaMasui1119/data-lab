# Exclude a variety of commonly ignored directories.
force-exclude = true
exclude = [
    ".mcp.json",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "*.ipynb",
    "notebooks"
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.13. This is the project's ceiling, not just its current version:
# PyIceberg, Polars and DuckDB all stop at 3.13, so it will not move for a while.
target-version = "py313"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = [
    "E",   # 基本スタイル・構文
    "F",   # バグ系(未使用変数など)
    "W",   # warning
    "I",   # import整形
    "B",   # bugger(バグ寄り)
    "UP",  # 古い構文の警告
    "PTH", # pathlib優先
    "SIM", # 簡約
    "RUF", # ruff固有(unused noqa/mutable default等)
    "S",   # bandit移植(セキュリティ)
]
ignore = [
    "D",
    "T201",
    "COM812",
    "COM819",
    "E111",
    "E114",
    "E117",
    "ISC001",
    "ISC002",
    "PLC0415",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
    # 全角括弧・チルダはダッシュボードのラベル等で意図的に使う。
    # 日本語文脈では ASCII 版と混同する余地がないので false positive として無効化。
    "RUF001", # String contains ambiguous fullwidth
    "RUF003", # Comment contains ambiguous fullwidth
    # S608 は silver/gold の DuckDB クエリ 45 箇所を一律に指摘する。いずれも
    # Iceberg のテーブル名や列名を f-string で埋める形で、値は schema CSV と
    # 会計年度などのバインド済みリテラルのみ。外部入力が SQL に到達する経路が
    # ないため、ルールごと無効化して残り (S101/S103/S603 等) を有効に保つ。
    # 経路が生まれた場合はここを外して個別に噛み砕くこと。
    "S608", # Possible SQL injection via string-based query construction
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = ["INP001", "S101"]

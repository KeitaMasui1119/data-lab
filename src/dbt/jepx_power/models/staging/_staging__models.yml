version: 2

models:
  - name: stg_jepx_spot_price
    description: "Typed and deduplicated JEPX spot price staging dataset sourced
      from bronze Iceberg table."
    columns:
      - name: delivery_datetime
        tests:
          - not_null
      - name: delivery_date
        tests:
          - not_null
      - name: time_code
        tests:
          - not_null
      - name: system_price
        tests:
          - not_null

  - name: stg_occto_unit_generation_actuals
    description: "Staging dataset for OCCTO unit generation actuals sourced from
      bronze Iceberg table."
    columns:
      - name: power_plant_code
        tests:
          - not_null
      - name: area
        tests:
          - not_null
      - name: power_plant_name
        tests:
          - not_null
      - name: target_date
        tests:
          - not_null
      - name: updated_datetime
        tests:
          - not_null
